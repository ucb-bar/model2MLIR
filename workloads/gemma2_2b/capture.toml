venv = ".venv"
python = "3.12"
deps = ["transformers"]

[env]
# Set HF_HOME in the environment or pass --env HF_HOME=/path/to/cache when
# capturing a locally cached checkpoint.
# A smoke capture uses two decoder layers with random weights. Clear this
# value with --env M2M_GEMMA_LAYERS= for the full pretrained model.
M2M_GEMMA_LAYERS = "2"
M2M_GEMMA_SESSION = "e2e"
